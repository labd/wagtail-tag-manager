[tox]
requires = tox>=4.22
envlist =
    py{311,313}-django52-wagtail70
    py{312,314}-django{52,60}-wagtail74
    py{311,314}-django52-wagtail80
    py{312,314}-django{60,61}-wagtail80
    lint

[testenv]
commands = pytest -rs {posargs}
dependency_groups = test
deps =
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
    wagtail70: wagtail>=7.0,<7.1
    wagtail74: wagtail>=7.4,<7.5
    wagtail80: wagtail>=8.0,<8.1

[testenv:lint]
skip_install = true
dependency_groups = lint
commands =
    ruff format --check src tests e2e
    ruff check src tests e2e
