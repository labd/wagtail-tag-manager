[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagtail-tag-manager"
version = "1.6.0"
description = "A Wagtail add-on for managing tags."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jasper Berghoef", email = "j.berghoef@me.com" }]
maintainers = [{ name = "Lab Digital" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Framework :: Wagtail",
  "Framework :: Wagtail :: 7",
  "Framework :: Wagtail :: 8",
]
dependencies = [
  "wagtail>=7.0",
  "wagtail_modeladmin>=2.3.0",
]

[project.optional-dependencies]
scanner = ["selenium>=3.141.0,<3.142.0"]

[project.urls]
Homepage = "https://github.com/labd/wagtail-tag-manager"
Source = "https://github.com/labd/wagtail-tag-manager"
Upstream = "https://github.com/jberghoef/wagtail-tag-manager"

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }]
test = [
  "factory_boy",
  "pytest-cov",
  "pytest-django",
  "pytest-randomly",
  "pytest",
  "wagtail_factories",
]
lint = ["ruff>=0.17.0"]
e2e = ["pytest-playwright>=0.10.0"]

[tool.uv]
# supply-chain: only resolve releases at least 14 days old; use
# exclude-newer-package for urgent security fixes
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Locked versions newer than the 14-day cutoff; remove after 2026-11-09
certifi = "2026-10-27T00:00:00Z"  # 2026.10.23 fixes GHSA-6q48-6c7w-9gw2
pillow = "2026-10-27T00:00:00Z"  # 13.0.0 fixes GHSA-24rc-8hj2-v98c GHSA-462x-pgg6-55fp GHSA-4rm8-3hmm-39fg ...

[tool.hatch.build.targets.wheel]
packages = ["src/wagtail_tag_manager"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
minversion = "3.0"
strict = true
django_find_project = false
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "error::wagtail.utils.deprecation.RemovedInWagtail90Warning",
]

[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["wagtail_tag_manager", "tests"]
