# This is a basic workflow to help you get started with Actions

name: Cypress

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: Cypress install
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          runTests: false

      - name: Install dependencies
        run: |
          make clean
          make requirements
          uv pip install -U -r sandbox/requirements.txt

      - name: Prepare database
        run: |
          uv run sandbox/manage.py migrate
          uv run sandbox/manage.py loaddata sandbox/exampledata/users.json
          uv run sandbox/manage.py loaddata sandbox/exampledata/cms.json
          uv run sandbox/manage.py loaddata sandbox/exampledata/default_tags.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database
          path: db.sqlite3

  run:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chrome
          - firefox
        spec:
          - cypress/e2e/admin.js
          - cypress/e2e/cookie_bar.js
          - cypress/e2e/cookie_consent.js
          - cypress/e2e/home_page.js
          - cypress/e2e/manage_page.js
          - cypress/e2e/sandbox.js
          - cypress/e2e/tags.js
          - cypress/e2e/triggers.js

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          make clean
          make requirements
          uv pip install -U -r sandbox/requirements.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database

      - name: Cypress run
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          install: false
          start: make run_test_sandbox
          wait-on: "http://127.0.0.1:8000"
          record: false
          browser: ${{ matrix.browser }}
          spec: ${{ matrix.spec }}
        env:
          ENVIRONMENT: test
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true

      # Kills the sandbox
      - name: Kill sandbox
        run: kill $(jobs -p) || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots-${{ strategy.job-index }}
          path: cypress/screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cypress-videos-${{ strategy.job-index }}
          path: cypress/videos
